name: Editor de mapas A Pulso - Windows
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '*.mjs'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    name: Compilar Editor de Mapas EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Electron y empaquetador
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Preparar Taller de Mapas con vista previa sin Internet
        run: node desktop/prepare-assets.cjs
      - name: Verificar sintaxis y almacenamiento
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/prepare-assets.cjs
          node --check desktop/web/editor-arenal.mjs
      - name: 'Verificar orden de capas - aceras bajo tejados'
        run: node tests/roof-layer-order.cjs
      - name: Verificar ciudad compartida y compatibilidad de pasos
        run: |
          node tests/city-project.mjs
          node tests/street-identifiers.mjs
          node tests/street-publication.mjs
          node tests/native-regression.mjs
      - name: Verificar suelo editado y cartel en el motor de Windows
        shell: pwsh
        run: |
          $renderQa = Join-Path $env:RUNNER_TEMP 'apulso-render-qa'
          npm install --prefix $renderQa --no-audit --no-fund @napi-rs/canvas linkedom fake-indexeddb postcss specificity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEX_PRIMARY_RUNTIME_NODE_MODULES = Join-Path $renderQa 'node_modules'
          $env:APULSO_DOM_TEST_MODULES = $env:CODEX_PRIMARY_RUNTIME_NODE_MODULES
          node tests/edited-arenal-preview.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/decor-rendering.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/vegetation-rendering.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/placement-rendering.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/custom-content-precision.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/selection-templates.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-workflow.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/map-gameplay.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/canopy-resize.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/overhead-clearance.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/map-gameplay-engine.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-gameplay-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/gameplay-publication.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/project-history-review.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-project-review-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-project-review-game.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-workbench.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Crear instalador EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publicar EXE para descargar
        uses: actions/upload-artifact@v4
        with:
          name: A-Pulso-Editor-de-Mapas-Windows-Instalador
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
