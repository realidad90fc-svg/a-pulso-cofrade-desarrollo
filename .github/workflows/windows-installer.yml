name: Editor de mapas A Pulso - Windows
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    name: Compilar Editor de Mapas EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Electron y empaquetador
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Preparar Taller de Mapas con vista previa sin Internet
        run: node desktop/prepare-assets.cjs
      - name: Verificar sintaxis y almacenamiento
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/prepare-assets.cjs
          node --check desktop/web/editor-arenal.mjs
      - name: 'Verificar orden de capas - aceras bajo tejados'
        run: node tests/roof-layer-order.cjs
      - name: Crear instalador EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publicar EXE para descargar
        uses: actions/upload-artifact@v4
        with:
          name: A-Pulso-Editor-de-Mapas-Windows-Instalador
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
